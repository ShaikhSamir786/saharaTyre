<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Sky to Sunset Tread Gradient -->
    <linearGradient id="treadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141c28"/>
      <stop offset="28%" stop-color="#223348"/>
      <stop offset="48%" stop-color="#465c6e"/>
      <stop offset="68%" stop-color="#8a7356"/>
      <stop offset="85%" stop-color="#d48a37"/>
      <stop offset="100%" stop-color="#f5a638"/>
    </linearGradient>

    <!-- Warm Dune Highlight Gradient -->
    <linearGradient id="duneLightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5a02e"/>
      <stop offset="60%" stop-color="#e87a22"/>
      <stop offset="100%" stop-color="#c95218"/>
    </linearGradient>

    <!-- Deep Red-Orange Dune Shadow Gradient -->
    <linearGradient id="duneDarkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c95218"/>
      <stop offset="70%" stop-color="#a63812"/>
      <stop offset="100%" stop-color="#7c2207"/>
    </linearGradient>

    <!-- Right Dune Gradient -->
    <linearGradient id="duneRightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#df6b1e"/>
      <stop offset="100%" stop-color="#9e2f0e"/>
    </linearGradient>
  </defs>

  <!-- Centered Tyre and Desert Dunes Logo Icon -->
  <g transform="translate(0, 15)">

    <!-- ================= TYRE TREAD (HERRINGBONE BLOCKS) ================= -->
    <g id="tyre" fill="url(#treadGrad)">
      <!-- Left Outer Blocks -->
      <path d="M 178 122 Q 170 126 165 142 L 157 185 L 202 153 L 202 122 Z" />
      <path d="M 155 195 L 148 240 L 202 208 L 202 163 Z" />
      <path d="M 147 250 L 144 290 L 202 258 L 202 218 Z" />
      <path d="M 144 300 L 143 325 Q 165 320 202 312 L 202 268 Z" />

      <!-- Left Inner Blocks -->
      <path d="M 210 118 L 210 148 L 244 122 L 244 116 Q 228 116 210 118 Z" />
      <path d="M 210 158 L 210 203 L 244 178 L 244 132 Z" />
      <path d="M 210 213 L 210 253 L 244 228 L 244 188 Z" />
      <path d="M 210 263 L 210 308 L 244 282 L 244 238 Z" />

      <!-- Right Inner Blocks -->
      <path d="M 290 118 L 290 148 L 256 122 L 256 116 Q 272 116 290 118 Z" />
      <path d="M 290 158 L 290 203 L 256 178 L 256 132 Z" />
      <path d="M 290 213 L 290 253 L 256 228 L 256 188 Z" />
      <path d="M 290 263 L 290 308 L 256 282 L 256 238 Z" />

      <!-- Right Outer Blocks -->
      <path d="M 322 122 Q 330 126 335 142 L 343 185 L 298 153 L 298 122 Z" />
      <path d="M 345 195 L 352 240 L 298 208 L 298 163 Z" />
      <path d="M 353 250 L 356 290 L 298 258 L 298 218 Z" />
      <path d="M 356 300 L 357 325 Q 335 320 298 312 L 298 268 Z" />
    </g>

    <!-- ================= DESERT DUNES ================= -->
    <g id="dunes">
      <!-- Back / Left Slope Dune (Dark Red-Orange) -->
      <path d="M 68 358 Q 165 352 225 316 C 248 302 260 292 266 280 C 266 288 260 306 244 326 C 218 356 168 360 68 358 Z" fill="url(#duneDarkGrad)" />

      <!-- Left Dune Lit Slope (Bright Orange-Red) -->
      <path d="M 68 358 C 168 360 218 356 244 326 C 255 312 260 296 262 284 C 262 298 254 324 232 344 C 196 376 132 364 68 358 Z" fill="url(#duneDarkGrad)" opacity="0.9" />

      <!-- Middle Golden Dune Face -->
      <path d="M 264 282 C 264 300 296 322 348 340 C 298 352 246 348 228 346 C 254 328 262 304 264 282 Z" fill="url(#duneLightGrad)" />

      <!-- Front Left Dune Body -->
      <path d="M 72 358 C 158 354 212 334 252 292 C 256 298 250 318 234 338 C 198 376 128 364 72 358 Z" fill="url(#duneDarkGrad)" />

      <!-- Base Sand Ridge (Sweeping across from left to right) -->
      <path d="M 65 358 Q 185 348 258 290 Q 320 338 435 358 C 362 344 305 340 262 345 C 205 352 145 356 65 358 Z" fill="url(#duneLightGrad)" />

      <!-- Far Right Dune Crest -->
      <path d="M 288 344 C 334 334 372 322 435 358 C 378 354 338 350 288 344 Z" fill="url(#duneRightGrad)" />
      
      <!-- Right Shadow Slope -->
      <path d="M 336 332 Q 375 324 435 358 Q 385 348 336 332 Z" fill="url(#duneDarkGrad)" />
    </g>

  </g>
</svg>
